name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    # CRACI tech challenge: builds run on CRACI
    runs-on: craci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agent/requirements.txt
      # tests use tiny fixtures and fake model clients: no data, no API keys needed
      - run: python -m pytest -q

  web:
    runs-on: craci
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
